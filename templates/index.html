<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenSpace | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); --card: rgba(255, 255, 255, 0.4); --text: #1e293b; }
        .dark { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --text: #f1f5f9; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: 0.5s; }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 32px; }
        .focus-active { transform: scale(1.1); border: 2px solid #6366f1; z-index: 50; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        <header id="header" class="flex justify-between items-center mb-12">
            <div><h1 class="text-3xl font-bold">ZenSpace</h1><p class="opacity-60">Focus on what matters.</p></div>
            <div class="flex gap-4">
                <button onclick="toggleDark()" class="glass p-3">🌙</button>
                <button onclick="toggleModal()" class="glass px-6 py-2 font-semibold">+ New Space</button>
            </div>
        </header>

        <div id="container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for space in spaces %}
            <div id="card-{{ space.id }}" class="space-card glass p-10 relative transition-all duration-700">
                <a href="/delete/{{ space.id }}" class="absolute top-6 right-6 text-red-400 hover:text-red-600">✕</a>
                <span class="text-xs font-bold uppercase tracking-widest text-indigo-500">{{ space.category }}</span>
                <h2 class="text-3xl font-semibold mt-2">{{ space.title }}</h2>
                <div class="my-10 text-6xl font-light tabular-nums" id="timer-{{ space.id }}">{{ space.duration }}:00</div>
                <button onclick="startFocus({{ space.id }}, {{ space.duration }})" id="btn-{{ space.id }}" class="w-full py-4 rounded-2xl bg-indigo-600 text-white font-bold">Start Session</button>
            </div>
            {% endfor %}
        </div>

        <div id="exit" class="hidden text-center mt-12">
            <button onclick="location.reload()" class="opacity-50 underline">End Focus Session</button>
        </div>
    </div>

    <!-- ADD SESSION MODAL -->
    <div id="modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-md flex items-center justify-center z-[100]">
        <div class="glass p-8 w-full max-w-md bg-white dark:bg-slate-800">
            <h3 class="text-xl font-bold mb-6">New Zen Space</h3>
            <form action="/add" method="POST" class="space-y-4">
                <input type="text" name="title" placeholder="Session Name" class="w-full p-4 rounded-xl bg-gray-100 dark:bg-slate-700 border-none" required>
                <input type="number" name="duration" placeholder="Minutes" class="w-full p-4 rounded-xl bg-gray-100 dark:bg-slate-700 border-none" required>
                <select name="category" class="w-full p-4 rounded-xl bg-gray-100 dark:bg-slate-700 border-none">
                    <option>Productivity</option><option>Mindfulness</option><option>Rest</option>
                </select>
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-bold">Create</button>
                    <button type="button" onclick="toggleModal()" class="flex-1 bg-gray-200 dark:bg-slate-600 py-4 rounded-xl">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <audio id="alarm" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        function toggleModal() { document.getElementById('modal').classList.toggle('hidden'); }
        function toggleDark() { document.body.classList.toggle('dark'); }

        function startFocus(id, mins) {
            document.getElementById('header').classList.add('hidden');
            document.getElementById('exit').classList.remove('hidden');
            
            document.querySelectorAll('.space-card').forEach(c => {
                if(c.id !== `card-${id}`) c.classList.add('hidden');
                else c.classList.add('focus-active');
            });

            let time = mins * 60;
            const display = document.getElementById(`timer-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            btn.classList.add('hidden');

            const countdown = setInterval(() => {
                const m = Math.floor(time / 60);
                const s = time % 60;
                display.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (--time < 0) {
                    clearInterval(countdown);
                    document.getElementById('alarm').play();
                    display.innerText = "Complete";
                }
            }, 1000);
        }
    </script>
</body>
</html>
